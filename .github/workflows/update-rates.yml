name: Update Exchange Rates

on:
  schedule:
    - cron: '*/10 0-10 * * 1-5'
    - cron: '0 11-23 * * 1-5'
    - cron: '0 */4 * * 0,6'
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and save exchange rates
        env:
          KOREAEXIM_KEY: ${{ secrets.KOREAEXIM_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, datetime, os, ssl

          KEY = os.environ['KOREAEXIM_KEY']

          # Eximbank 제공 19개
          EXIM_CODE_MAP = {
              'USD':'USD',    'JPY':'JPY(100)', 'EUR':'EUR',     'GBP':'GBP',
              'AUD':'AUD',    'CAD':'CAD',      'NZD':'NZD',     'CHF':'CHF',
              'SEK':'SEK',    'DKK':'DKK',      'NOK':'NOK',     'HKD':'HKD',
              'SGD':'SGD',    'CNY':'CNH',       'THB':'THB',     'MYR':'MYR',
              'IDR':'IDR(100)','AED':'AED',      'SAR':'SAR',
          }

          # 보조 API 대상 14개 (Eximbank에 없음)
          FALLBACK_CODES = ['TWD','INR','VND','PHP','GEL','NPR',
                            'TRY','CZK','HUF','PLN','MVR','MXN','MNT']

          # 매매기준율 → 살 때 환율 변환 스프레드
          SPREAD_MAP = {
              'USD':0.0175,'JPY':0.0175,'EUR':0.0175,'GBP':0.0175,
              'AUD':0.020, 'CAD':0.020, 'NZD':0.020, 'CHF':0.020,
              'HKD':0.020, 'SGD':0.020,
              'SEK':0.025, 'DKK':0.025, 'NOK':0.025,
              'CNY':0.025, 'TWD':0.025, 'MYR':0.025, 'AED':0.025, 'SAR':0.025,
              'THB':0.030, 'VND':0.030, 'PHP':0.030, 'IDR':0.030, 'INR':0.030,
              'TRY':0.030, 'CZK':0.025, 'HUF':0.025, 'PLN':0.025,
              'MVR':0.035, 'MXN':0.025, 'MNT':0.035,
              'GEL':0.035, 'NPR':0.035,
          }

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          def urlget(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15, context=ctx) as r:
                  return json.loads(r.read())

          def fetch_eximbank(ymd):
              url = (f'https://www.koreaexim.go.kr/site/program/financial/exchangeJSON'
                     f'?authkey={KEY}&searchdate={ymd}&data=AP01')
              try:
                  data = urlget(url)
                  if not isinstance(data, list) or not data:
                      return None
                  tts_map = {}
                  for item in data:
                      if item.get('result') == 1:
                          try:
                              tts = float(str(item.get('tts','')).replace(',',''))
                              if tts > 0:
                                  tts_map[item['cur_unit']] = tts
                          except Exception:
                              pass
                  rates = {}
                  for app_code, exim_code in EXIM_CODE_MAP.items():
                      r = tts_map.get(exim_code)
                      if r:
                          if '(100)' in exim_code:
                              r /= 100
                          rates[app_code] = round(r, 4)
                  return rates if rates else None
              except Exception as e:
                  print(f'  eximbank({ymd}) failed: {e}')
                  return None

          def fetch_fallback():
              try:
                  data = urlget('https://api.exchangerate-api.com/v4/latest/USD')
                  raw = data.get('rates', {})
                  krw = raw.get('KRW', 1370)
                  rates = {}
                  for code in FALLBACK_CODES:
                      r = raw.get(code)
                      if r and r > 0:
                          mid = krw / r
                          spread = SPREAD_MAP.get(code, 0.02)
                          rates[code] = round(mid * (1 + spread), 4)
                  return rates
              except Exception as e:
                  print(f'  fallback failed: {e}')
                  return {}

          os.makedirs('nowmoney/rates', exist_ok=True)
          today = datetime.date.today()

          # 보조 API (항상 먼저 받아둠)
          fallback_rates = fetch_fallback()
          print(f'fallback: {len(fallback_rates)} currencies')

          # latest.json — 가장 최근 영업일 Eximbank + 보조 API 합산
          latest_date = None
          for i in range(7):
              d = today - datetime.timedelta(days=i)
              exim = fetch_eximbank(d.strftime('%Y%m%d'))
              if exim:
                  latest_date = d
                  combined = {**fallback_rates, **exim}  # Eximbank 우선
                  combined['KRW'] = 1.0
                  result = {
                      'date': d.isoformat(),
                      'fetchedAt': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
                      'rates': combined,
                  }
                  with open('nowmoney/rates/latest.json', 'w') as f:
                      json.dump(result, f)
                  print(f'latest.json: {d.isoformat()} ({len(combined)} currencies)')
                  break

          # prev.json — 직전 영업일 (변동% 표시용)
          if latest_date:
              for i in range(1, 8):
                  d = latest_date - datetime.timedelta(days=i)
                  prev = fetch_eximbank(d.strftime('%Y%m%d'))
                  if prev:
                      with open('nowmoney/rates/prev.json', 'w') as f:
                          json.dump({'date': d.isoformat(), 'rates': prev}, f)
                      print(f'prev.json: {d.isoformat()}')
                      break
          PYEOF

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add nowmoney/rates/
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: update exchange rates $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push
